name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Stamp the app version from package.json onto the Android project
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "var v=require('./package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+v[2]")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Copy the web app into it
        run: npx cap sync android

      - name: Use the same signing key on every build (so updates install in place)
        run: |
          mkdir -p "$HOME/.android"
          cp ci-debug.keystore "$HOME/.android/debug.keystore"

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bello-stock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
