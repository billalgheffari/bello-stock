/* Layout: a one-hand phone app. Sticky header, one scrolling tab, five-tab bar fixed at the bottom.
   Palette: pharmacy-shelf green on cool paper, amber for stock warnings, red for debt. */
:root {
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --surface2: #E3EAE6;
  --fg: #14231F;
  --muted: #55665F;
  --line: #CFDAD4;
  --accent: #0B6B58;
  --accent-fg: #FFFFFF;
  --accent-soft: #D3EAE2;
  --warn: #8F5400;
  --warn-soft: #F7E7C6;
  --bad: #B3261E;
  --bad-soft: #F7DAD6;
  --good: #1B7A3D;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1815; --surface: #16241F; --surface2: #1F312A; --fg: #E6F0EB; --muted: #9AAEA6;
    --line: #2B4037; --accent: #4FC3A5; --accent-fg: #05201A; --accent-soft: #1B3A31;
    --warn: #E8B659; --warn-soft: #3A2D12; --bad: #F2877F; --bad-soft: #3F201D; --good: #6FD08B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1815; --surface: #16241F; --surface2: #1F312A; --fg: #E6F0EB; --muted: #9AAEA6;
  --line: #2B4037; --accent: #4FC3A5; --accent-fg: #05201A; --accent-soft: #1B3A31;
  --warn: #E8B659; --warn-soft: #3A2D12; --bad: #F2877F; --bad-soft: #3F201D; --good: #6FD08B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* In the Android wrapper nothing else pads the top, so the sticky header would sit on top of the first content. */
:root { padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(20px + env(safe-area-inset-bottom, 0px));
}
#splash { position: fixed; inset: 0; z-index: 50; background: var(--accent); color: var(--accent-fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: opacity .4s ease; }
#splash.hide { opacity: 0; pointer-events: none; }
#splash b { font-size: 30px; font-weight: 700; animation: splashIn .6s ease both; }
#splash span { font-size: 14px; opacity: .9; animation: splashIn .6s .12s ease both; }
@keyframes splashIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #splash b, #splash span { animation: none; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin-inline: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 21px; letter-spacing: .01em; font-weight: 700; }
.brand span { font-size: 12px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

h2.sec { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 22px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); }
.end { text-align: end; white-space: nowrap; }
.big { font-size: 30px; font-weight: 700; line-height: 1.15; }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { min-height: 36px; padding: 5px 11px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

input[type=text], input[type=search], input[type=number], input[type=tel], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
}
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.pbtn { text-align: start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 76px; }
.pbtn:active { background: var(--accent-soft); }
.pbtn .pn { font-weight: 600; overflow-wrap: anywhere; }
.pbtn .pp { color: var(--accent); font-weight: 700; }
.pbtn .ps { font-size: 12px; color: var(--muted); }
.pbtn .ps.low { color: var(--warn); font-weight: 600; }

.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); font-size: 18px; line-height: 1; font-weight: 700; }
.stepper .q { min-width: 28px; text-align: center; font-weight: 700; }

.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 9px 2px; border-radius: 9px; font-weight: 600; font-size: 13.5px; min-height: 40px; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.totalbar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }

nav.tabs { display: none; }
.hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-height: 92px; justify-content: center; }
.hcard:active { background: var(--accent-soft); }
.hcard .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.hcard .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hcard span.lbl { font-weight: 600; font-size: 13.5px; }
.backbar { display: flex; align-items: center; gap: 10px; }
.backbar .title { flex: 1; text-align: center; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }

#sheetWrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheetWrap .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-head h2 { margin: 0; font-size: 18px; }
.sheet-head button { border: 0; background: var(--surface2); width: 40px; height: 40px; border-radius: 50%; font-size: 22px; line-height: 1; }

.paper { background: #fff; color: #111; width: 100%; max-width: 300px; margin: 12px auto; padding: 16px 14px; border-radius: 4px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.paper .c { text-align: center; }
.paper hr { border: 0; border-top: 1px dashed #888; margin: 8px 0; }
.paper .l { display: flex; justify-content: space-between; gap: 8px; }
.paper .l span:first-child { overflow-wrap: anywhere; }
#toast { position: fixed; inset-inline: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; margin-inline: auto; width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
.stat { padding: 14px; }
.stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 22px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .pbtn, .btn, nav.tabs button { transition: background .12s; } }

<div id="splash"><b dir="ltr" lang="en">Bello stock</b><span id="splashTag">محلك في مكان آمن</span></div>

</div>

  </div>
</div>
<div id="toast" role="status" hidden></div>

];
function countryOf(code) { return COUNTRIES.find(function (c) { return c.code === code; }); }
function countryName(c) { return c[lang()] || c.ar; }

/* ---------- money: integer centimes, quantities in thousandths, tax in basis points ---------- */
function fmt(c) {
  var neg = c < 0; c = Math.abs(c);
  var w = Math.trunc(c / 100), f = c % 100;
  var s = String(w).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (f) s += ',' + String(f).padStart(2, '0');
  return (neg ? '−' : '') + s + ' ' + curSuffix();
}
function m(c) { return '<bdi class="num">' + fmt(c) + '</bdi>'; }

function divRound(a, b) { return Math.floor((2 * a + b) / (2 * b)); }
function calcLine(price, qtyMilli, taxBp, include, discount) {
  var gross = divRound(qtyMilli * price, 1000) - (discount || 0), net, tax;
  if (include) { net = divRound(gross * 10000, 10000 + taxBp); tax = gross - net; }
  else { net = gross; tax = divRound(gross * taxBp, 10000); }
  return { net: net, tax: tax, total: net + tax };
}

function load() {

}

function nid() { return ++S.seq.id; }
function stockOf(pid) { var t = 0; S.stock.forEach(function (x) { if (x.pid === pid) t += x.qty; }); return t; }
function balanceOf(cid) { var t = 0; S.ledger.forEach(function (x) { if (x.cid === cid) t += x.amount; }); return t; }
function fundBalance() { var t = 0; S.fund.forEach(function (x) { if (x.method === 'cash') t += x.amount; }); return t; }
function prod(id) { return S.products.find(function (p) { return p.id === id; }); }

function dt(ts) {

  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- domain functions: each one is a single atomic update, like the data layer in architecture.md ---------- */
var METHOD_KEYS = ['cash', 'credit', 'card', 'cheque', 'wallet'];
function methodLabel(k) { return t('method.' + k); }
function methodOptions(selected, excludeCredit) {
  return METHOD_KEYS.filter(function (k) { return !excludeCredit || k !== 'credit'; }).map(function (k) {
    return '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + methodLabel(k) + '</option>';
  }).join('');
}
function cartLines(cart) {
  return cart.map(function (c) {
    var p = prod(c.pid), qm = c.qty * 1000, l = calcLine(p.price, qm, p.taxBp, S.settings.includeTax, 0);
    return { pid: p.id, name: p.name, qty: qm, price: p.price, taxBp: p.taxBp, net: l.net, tax: l.tax, total: l.total, cost: p.cost };
  });
}
function createSale(o) {
  var lines = cartLines(o.cart);
  if (!lines.length) throw new Error(t('sale.emptyCartErr'));
  var sub = 0, tax = 0;
  lines.forEach(function (l) { sub += l.net; tax += l.tax; });
  var total = sub + tax, paid = o.paid;
  if (o.method === 'credit') {
    if (!o.customerId) throw new Error(t('sale.chooseCustomerErr'));
    if (paid < 0 || paid > total) throw new Error(t('sale.paidAmountErr'));
  } else paid = total;
  var ts = Date.now(), id = nid(), number = ++S.seq.inv;
  var inv = { id: id, number: number, customerId: o.customerId || null, ts: ts, method: o.method, subtotal: sub, tax: tax, total: total, paid: paid, lines: lines };
  S.invoices.push(inv);
  lines.forEach(function (l) { S.stock.push({ pid: l.pid, qty: -l.qty, kind: 'sale', doc: id, ts: ts }); });
  if (o.method === 'credit') {
    S.ledger.push({ cid: o.customerId, ts: ts, kind: 'invoice', amount: total, doc: id, note: t('receipt.invoiceNo') + ' ' + number });
    if (paid > 0) S.ledger.push({ cid: o.customerId, ts: ts, kind: 'payment', amount: -paid, doc: id, note: t('party.recordPayment') });
  }
  if (paid > 0) S.fund.push({ ts: ts, kind: 'sale', method: o.method === 'credit' ? 'cash' : o.method, amount: paid, doc: id, note: t('receipt.invoiceNo') + ' ' + number });
  save();
  return inv;
}
function recordCustomerPayment(cid, amount, method) {
  if (amount <= 0) throw new Error(t('form.validAmount'));
  var ts = Date.now(), id = nid();
  S.ledger.push({ cid: cid, ts: ts, kind: 'payment', amount: -amount, doc: id, note: t('party.recordPayment') });
  S.fund.push({ ts: ts, kind: 'customer_payment', method: method, amount: amount, doc: id, note: cust(cid).name });
  save();
}

/* the phone's hardware back key does NOT reuse the browser history above unless we take it over

var _loadedScripts = {};
function loadScript(src) {
  if (_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src; s.onload = function () { resolve(); }; s.onerror = function () { reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}
function renderReceiptCanvas(inv) {

    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff;color:#111;padding:16px';
    box.innerHTML = receiptPrintHtml(inv);
    document.body.appendChild(box);
    return window.html2canvas(box, { scale: 2, backgroundColor: '#ffffff' }).then(function (canvas) {
      document.body.removeChild(box);
      return canvas;
    }, function (err) { document.body.removeChild(box); throw err; });

function shareFilePreviewFallback(dataUrl) {
  openSheet(t('receipt.chooseFormatTitle'), '<div class="note">' + t('receipt.saveToView') + '</div><img src="' + dataUrl + '" style="max-width:100%;border:1px solid #ddd;border-radius:8px;margin-top:8px">');

function shareReceiptAs(inv, kind) {
  if (kind === 'text') { ACTS.shareReceipt({ dataset: { id: inv.id } }); return; }
  toast(t('receipt.preparing'));
  renderReceiptCanvas(inv).then(function (canvas) {
    if (kind === 'jpg') {
      var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      return shareDataFile(dataUrl, 'image/jpeg', 'receipt-' + inv.number + '.jpg', dataUrl);
    }
    return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.0.0/jspdf.umd.min.js').then(function () {
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
      doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, canvas.width, canvas.height);
      var pdfUri = doc.output('datauristring');
      return shareDataFile(pdfUri, 'application/pdf', 'receipt-' + inv.number + '.pdf', canvas.toDataURL('image/jpeg', 0.92));
    });
  }).catch(function () { toast(t('receipt.shareFailed')); });
}
function shareDataFile(dataUrl, mime, filename, previewDataUrl) {
  var FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
  var ShareP = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
  if (FS && FS.writeFile && ShareP && ShareP.share) {
    return FS.writeFile({ path: filename, data: dataUriBody(dataUrl), directory: 'CACHE', recursive: true }).then(function (res) {
      return ShareP.share({ url: res.uri, files: [res.uri] }).catch(function () {});
    });
  }
  shareFilePreviewFallback(previewDataUrl);
  return Promise.resolve();
}

  },
  expense: function (f, fd) { addExpense(fd.get('cat'), toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast(t('form.expenseRecorded')); },
  fundin: function (f, fd) { addFundEntry('in', toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast(t('cash.deposited')); },
  fundout: function (f, fd) { addFundEntry('out', toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast(t('cash.withdrawn')); },
  supplier: function (f, fd) {
    var name = fd.get('name').trim(); if (!name) throw new Error(t('party.supplierNameRequired'));
    var s = { id: nid(), name: name, phone: fd.get('phone').trim() };
    S.suppliers.push(s);
    var d = toCents(fd.get('debt')); if (d > 0) S.ledger.push({ sid: s.id, ts: Date.now(), kind: 'opening', amount: d, note: t('form.priorDebt') });
    save(); closeSheet(); render(); toast(t('party.supplierAdded'));
  },
  supplierPayment: function (f, fd) {
    recordSupplierPayment(+f.dataset.id, toCents(fd.get('amount')), fd.get('method') || 'cash');
    closeSheet(); render(); toast(t('party.paymentRecorded'));
  },
  supplierDebt: function (f, fd) {
    recordSupplierDebt(+f.dataset.id, toCents(fd.get('amount')), (fd.get('note') || '').trim());
    closeSheet(); render(); toast(t('party.invoiceRecorded'));
  },
  settings: function (f, fd) {
    S.settings.shop = (fd.get('shop') || '').trim();
    var newLang = fd.get('lang'); if (newLang !== 'ar' && newLang !== 'fr' && newLang !== 'en') newLang = 'ar';
    S.settings.lang = newLang;
    var newCountry = fd.get('country'); if (!countryOf(newCountry)) newCountry = 'DZ';
    S.settings.country = newCountry;
    var newCurrency = fd.get('currency'); if (!CURRENCIES[newCurrency]) newCurrency = 'DZD';
    S.settings.currency = newCurrency;
    save(); applyLangAttrs(); closeSheet(); render(); toast(t('form.settingsSaved'));
  }
};

/* ---------- events ---------- */
var ACTS = {
  home: function (b) {
    var key = b.dataset.key;
    if (key === 'suppliers' || key === 'customers') { ui.partyTab = key; nav('customers'); }
    else nav(key);
  },
  back: function () { history.back(); },
  closeSheet: function () { closeSheet(); render(); },
  add: function (b) {
    var id = +b.dataset.id, l = ui.cart.find(function (c) { return c.pid === id; });
    if (l) l.qty++; else ui.cart.push({ pid: id, qty: 1 });
    cartInto();
  },
  inc: function (b) { ui.cart[+b.dataset.i].qty++; cartInto(); },
  dec: function (b) { var l = ui.cart[+b.dataset.i]; l.qty--; if (l.qty <= 0) ui.cart.splice(+b.dataset.i, 1); cartInto(); },
  clear: function () { ui.cart = []; ui.paid = ''; cartInto(); },
  method: function (b) { ui.method = b.dataset.m; cartInto(); },
  save: function () {
    var paidEl = document.getElementById('paid'); if (paidEl) ui.paid = paidEl.value;
    try {
      var inv = createSale({ cart: ui.cart, method: ui.method, customerId: ui.cust ? +ui.cust : null, paid: ui.method === 'credit' ? toCents(ui.paid) : 0 });
      ui.cart = []; ui.paid = ''; ui.cust = ''; ui.method = 'cash';
      cartInto(); gridInto(); showReceipt(inv);
    } catch (e) { toast(e.message); }
  },
  newProduct: formProduct,
  newCustomer: formCustomer,
  restock: function (b) { var p = prod(+b.dataset.id); formAmount(t('products.restockTitle') + ': ' + p.name, 'restock', '', b.dataset.id); document.querySelector('label[for=amount]').textContent = t('products.qtyReceived'); },
  deleteProduct: function (b) { var p = prod(+b.dataset.id); if (p) formDeleteProduct(p); },
  confirmDeleteProduct: function (b) { deleteProduct(+b.dataset.id); closeSheet(); render(); toast(t('products.deleted')); },
  customer: function (b) { showCustomer(+b.dataset.id); },
  payment: function (b) {
    formAmount(t('party.recordPayment'), 'payment', '<label class="f" for="method">' + t('sale.payMethod') + '</label><select id="method" name="method">' + methodOptions('cash', true) + '</select>', b.dataset.id);
  },
  copyStatement: function (b) {
    var text = statementText(+b.dataset.id);
    var show = function () { openSheet(t('party.statement'), '<textarea id="st" rows="10" readonly>' + esc(text) + '</textarea><div class="note">' + t('party.sendWhatsapp') + '</div>'); document.getElementById('st').select(); };
    try { navigator.clipboard.writeText(text).then(function () { toast(t('party.statementCopied')); }, show); } catch (e) { show(); }
  },
  shareReceipt: function (b) {
    var inv = invById(+b.dataset.id); if (!inv) return;
    var text = receiptText(inv);
    var show = function () { openSheet(t('receipt.textTitle'), '<textarea id="rt" rows="10" readonly>' + esc(text) + '</textarea><div class="note">' + t('receipt.textNote') + '</div>'); document.getElementById('rt').select(); };
    var ShareP = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Share;
    if (ShareP && ShareP.share) { ShareP.share({ text: text }).catch(function () {}); return; }
    if (navigator.share) { navigator.share({ text: text }).catch(function () {}); }
    else { try { navigator.clipboard.writeText(text).then(function () { toast(t('receipt.textCopied')); }, show); } catch (e) { show(); } }
  },
  printReceipt: function (b) {
    var inv = invById(+b.dataset.id); if (!inv) return;
    var P = window.Capacitor && Capacitor.Plugins && (Capacitor.Plugins.Printer || Capacitor.Plugins.CapacitorPrinter);
    if (P && P.printHtml) {
      P.printHtml({ html: receiptPrintHtml(inv), name: t('receipt.invoiceNo') + '-' + inv.number }).catch(function () { toast(t('receipt.printFailed')); });
      return;
    }
    toast(t('receipt.noPrinter'));
  },
  shareChooser: function (b) {
    var inv = invById(+b.dataset.id); if (!inv) return;
    formShareChooser(inv);
  },
  shareAs: function (b) {
    var inv = invById(+b.dataset.id); if (!inv) return;
    closeSheet();
    shareReceiptAs(inv, b.dataset.kind);
  },
  fundIn: function () { formAmount(t('cash.inTitle'), 'fundin', field('note', t('common.note'), 'type="text" autocomplete="off"')); },
  fundOut: function () { formAmount(t('cash.outTitle'), 'fundout', field('note', t('common.note'), 'type="text" autocomplete="off"')); },
  expense: function () {
    var cats = ['rent', 'utilities', 'wages', 'transport', 'other'];
    formAmount(t('form.expenseNew'), 'expense', '<label class="f" for="cat">' + t('form.category') + '</label><select id="cat" name="cat">' + cats.map(function (c) { return '<option>' + t('cat.' + c) + '</option>'; }).join('') + '</select>' + field('note', t('common.note'), 'type="text" autocomplete="off"'));
  },
  partyTab: function (b) { ui.partyTab = b.dataset.p; render(); },
  newSupplier: formSupplier,
  supplier: function (b) { showSupplier(+b.dataset.id); },
  supplierPayment: function (b) {
    formAmount(t('form.supplierPaymentTitle'), 'supplierPayment', '<label class="f" for="method">' + t('sale.payMethod') + '</label><select id="method" name="method">' + methodOptions('cash', true) + '</select>', b.dataset.id);
  },
  supplierDebt: function (b) { formAmount(t('form.supplierInvoiceTitle'), 'supplierDebt', field('note', t('form.invoiceNotePh'), 'type="text" autocomplete="off"'), b.dataset.id); },
  settings: formSettings,
  reset: function () { S = seed(); ui.cart = []; ui.cust = ''; ui.paid = ''; ui.method = 'cash'; save(); applyLangAttrs(); render(); toast(t('reports.resetDone')); }
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || !ACTS[b.dataset.act]) return;
  ACTS[b.dataset.act](b);
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; gridInto(); }
  else if (id === 'pq') { ui.pq = e.target.value; listProducts(); }
  else if (id === 'cq') { ui.cq = e.target.value; listCustomers(); }
  else if (id === 'sq') { ui.sq = e.target.value; listSuppliers(); }
  else if (id === 'paid') { ui.paid = e.target.value; }
});
document.addEventListener('change', function (e) { if (e.target.id === 'custSel') ui.cust = e.target.value; });
document.addEventListener('change', function (e) {
  if (e.target.id === 'country') {
    var opt = e.target.selectedOptions[0], cur = opt && opt.getAttribute('data-cur');
    var curSel = document.getElementById('currency');
    if (cur && curSel) curSel.value = cur;
  }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, h = HANDLERS[f.dataset.form]; if (!h) return;
  try { h(f, new FormData(f)); } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('sheetWrap').hidden) ACTS.closeSheet(); });
applyLangAttrs();
var splashTagEl = document.getElementById('splashTag'); if (splashTagEl) splashTagEl.textContent = t('splashTag');
syncBrand();
render();
setTimeout(function () {
  var sp = document.getElementById('splash'); if (!sp) return;
  sp.classList.add('hide');
  setTimeout(function () { sp.hidden = true; }, 450);
}, 1100);
</script>

</body>
