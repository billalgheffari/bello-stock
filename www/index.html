<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bello stock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script>document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';</script>
<style>
/* Layout: a one-hand phone app. Sticky header, one scrolling tab, five-tab bar fixed at the bottom.
   Palette: pharmacy-shelf green on cool paper, amber for stock warnings, red for debt. */
:root {
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --surface2: #E3EAE6;
  --fg: #14231F;
  --muted: #55665F;
  --line: #CFDAD4;
  --accent: #0B6B58;
  --accent-fg: #FFFFFF;
  --accent-soft: #D3EAE2;
  --warn: #8F5400;
  --warn-soft: #F7E7C6;
  --bad: #B3261E;
  --bad-soft: #F7DAD6;
  --good: #1B7A3D;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1815; --surface: #16241F; --surface2: #1F312A; --fg: #E6F0EB; --muted: #9AAEA6;
    --line: #2B4037; --accent: #4FC3A5; --accent-fg: #05201A; --accent-soft: #1B3A31;
    --warn: #E8B659; --warn-soft: #3A2D12; --bad: #F2877F; --bad-soft: #3F201D; --good: #6FD08B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1815; --surface: #16241F; --surface2: #1F312A; --fg: #E6F0EB; --muted: #9AAEA6;
  --line: #2B4037; --accent: #4FC3A5; --accent-fg: #05201A; --accent-soft: #1B3A31;
  --warn: #E8B659; --warn-soft: #3A2D12; --bad: #F2877F; --bad-soft: #3F201D; --good: #6FD08B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin-inline: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 21px; letter-spacing: .01em; font-weight: 700; }
.brand span { font-size: 12px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

h2.sec { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 22px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); }
.end { text-align: end; white-space: nowrap; }
.big { font-size: 30px; font-weight: 700; line-height: 1.15; }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.small { min-height: 36px; padding: 5px 11px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

input[type=text], input[type=search], input[type=number], input[type=tel], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
}
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.pbtn { text-align: start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 76px; }
.pbtn:active { background: var(--accent-soft); }
.pbtn .pn { font-weight: 600; overflow-wrap: anywhere; }
.pbtn .pp { color: var(--accent); font-weight: 700; }
.pbtn .ps { font-size: 12px; color: var(--muted); }
.pbtn .ps.low { color: var(--warn); font-weight: 600; }

.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); font-size: 18px; line-height: 1; font-weight: 700; }
.stepper .q { min-width: 28px; text-align: center; font-weight: 700; }

.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 9px 2px; border-radius: 9px; font-weight: 600; font-size: 13.5px; min-height: 40px; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.totalbar { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }

nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 52px; }
nav.tabs button[aria-current=page] { color: var(--accent); background: var(--accent-soft); }
nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#sheetWrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheetWrap .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.sheet-head h2 { margin: 0; font-size: 18px; }
.sheet-head button { border: 0; background: var(--surface2); width: 40px; height: 40px; border-radius: 50%; font-size: 22px; line-height: 1; }

.paper { background: #fff; color: #111; width: 100%; max-width: 300px; margin: 12px auto; padding: 16px 14px; border-radius: 4px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.paper .c { text-align: center; }
.paper hr { border: 0; border-top: 1px dashed #888; margin: 8px 0; }
.paper .l { display: flex; justify-content: space-between; gap: 8px; }
.paper .l span:first-child { overflow-wrap: anywhere; }
#toast { position: fixed; inset-inline: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; margin-inline: auto; width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
.stat { padding: 14px; }
.stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 22px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .pbtn, .btn, nav.tabs button { transition: background .12s; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b dir="ltr" lang="en">Bello stock</b><span>محاسبة المحل</span></div>
    <span class="chip warn">نموذج تجريبي</span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="التنقل"><div class="in" id="tabs"></div></nav>
<div id="sheetWrap" hidden>
  <div class="backdrop" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" data-act="closeSheet" aria-label="إغلاق">&times;</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
/* ---------- money: integer centimes, quantities in thousandths, tax in basis points ---------- */
function fmt(c) {
  var neg = c < 0; c = Math.abs(c);
  var w = Math.trunc(c / 100), f = c % 100;
  var s = String(w).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (f) s += ',' + String(f).padStart(2, '0');
  return (neg ? '−' : '') + s + ' د.ج';
}
function m(c) { return '<bdi class="num">' + fmt(c) + '</bdi>'; }
function toCents(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? Math.round(n * 100) : 0; }
/* half-up rounding on integers */
function divRound(a, b) { return Math.floor((2 * a + b) / (2 * b)); }
function calcLine(price, qtyMilli, taxBp, include, discount) {
  var gross = divRound(qtyMilli * price, 1000) - (discount || 0), net, tax;
  if (include) { net = divRound(gross * 10000, 10000 + taxBp); tax = gross - net; }
  else { net = gross; tax = divRound(gross * taxBp, 10000); }
  return { net: net, tax: tax, total: net + tax };
}

/* ---------- state ---------- */
var KEY = 'bello-stock-demo-v1';
var S;
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) {
  return String(s).normalize('NFD').replace(/[ً-ْـ̀-ͯ]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase().trim();
}
function seed() {
  var now = Date.now(), day = 86400000, da = function (n) { return n * 100; };
  var st = {
    settings: { includeTax: true, shop: 'بقالة الأمل (مثال)' },
    seq: { id: 100, inv: 0 },
    products: [
      { id: 1, name: 'حليب 1 لتر', price: da(70), taxBp: 0, cost: da(55), min: 10 },
      { id: 2, name: 'خبز', price: da(10), taxBp: 0, cost: da(7), min: 20 },
      { id: 3, name: 'قهوة 250 غ', price: da(380), taxBp: 1900, cost: da(300), min: 4 },
      { id: 4, name: 'سكر 1 كغ', price: da(110), taxBp: 0, cost: da(90), min: 10 },
      { id: 5, name: 'زيت 1 لتر', price: da(190), taxBp: 0, cost: da(160), min: 6 },
      { id: 6, name: 'شاي أخضر', price: da(120), taxBp: 0, cost: da(95), min: 5 }
    ],
    customers: [
      { id: 1, name: 'عمي مراد', phone: '0555 00 00 01' },
      { id: 2, name: 'سعيد', phone: '0555 00 00 02' }
    ],
    invoices: [], stock: [], ledger: [], fund: [], expenses: []
  };
  [[1, 24], [2, 60], [3, 6], [4, 8], [5, 15], [6, 12]].forEach(function (p) { st.stock.push({ pid: p[0], qty: p[1] * 1000, kind: 'opening', ts: now - 5 * day }); });
  st.ledger.push({ cid: 1, ts: now - 4 * day, kind: 'opening', amount: da(3200), note: 'رصيد افتتاحي' });
  st.fund.push({ ts: now - 5 * day, kind: 'manual_in', method: 'cash', amount: da(5000), note: 'رصيد افتتاحي' });
  return st;
}
function load() {
  try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (o && o.products) return o; } } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();

function nid() { return ++S.seq.id; }
function stockOf(pid) { var t = 0; S.stock.forEach(function (x) { if (x.pid === pid) t += x.qty; }); return t; }
function balanceOf(cid) { var t = 0; S.ledger.forEach(function (x) { if (x.cid === cid) t += x.amount; }); return t; }
function fundBalance() { var t = 0; S.fund.forEach(function (x) { if (x.method === 'cash') t += x.amount; }); return t; }
function prod(id) { return S.products.find(function (p) { return p.id === id; }); }
function cust(id) { return S.customers.find(function (c) { return c.id === id; }); }
function qtyTxt(milli) { var q = milli / 1000; return Number.isInteger(q) ? String(q) : q.toFixed(2); }
function dt(ts) {
  var d = new Date(ts), p = function (n) { return String(n).padStart(2, '0'); };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

/* ---------- domain functions: each one is a single atomic update, like the data layer in architecture.md ---------- */
var METHODS = { cash: 'نقدًا', credit: 'آجل', card: 'بطاقة', cheque: 'شيك', wallet: 'محفظة' };
function cartLines(cart) {
  return cart.map(function (c) {
    var p = prod(c.pid), qm = c.qty * 1000, l = calcLine(p.price, qm, p.taxBp, S.settings.includeTax, 0);
    return { pid: p.id, name: p.name, qty: qm, price: p.price, taxBp: p.taxBp, net: l.net, tax: l.tax, total: l.total, cost: p.cost };
  });
}
function createSale(o) {
  var lines = cartLines(o.cart);
  if (!lines.length) throw new Error('السلة فارغة');
  var sub = 0, tax = 0;
  lines.forEach(function (l) { sub += l.net; tax += l.tax; });
  var total = sub + tax, paid = o.paid;
  if (o.method === 'credit') {
    if (!o.customerId) throw new Error('اختر عميلًا للبيع الآجل');
    if (paid < 0 || paid > total) throw new Error('المبلغ المدفوع غير صحيح');
  } else paid = total;
  var ts = Date.now(), id = nid(), number = ++S.seq.inv;
  var inv = { id: id, number: number, customerId: o.customerId || null, ts: ts, method: o.method, subtotal: sub, tax: tax, total: total, paid: paid, lines: lines };
  S.invoices.push(inv);
  lines.forEach(function (l) { S.stock.push({ pid: l.pid, qty: -l.qty, kind: 'sale', doc: id, ts: ts }); });
  if (o.method === 'credit') {
    S.ledger.push({ cid: o.customerId, ts: ts, kind: 'invoice', amount: total, doc: id, note: 'فاتورة ' + number });
    if (paid > 0) S.ledger.push({ cid: o.customerId, ts: ts, kind: 'payment', amount: -paid, doc: id, note: 'دفعة مع الفاتورة ' + number });
  }
  if (paid > 0) S.fund.push({ ts: ts, kind: 'sale', method: o.method === 'credit' ? 'cash' : o.method, amount: paid, doc: id, note: 'فاتورة ' + number });
  save();
  return inv;
}
function recordCustomerPayment(cid, amount, method) {
  if (amount <= 0) throw new Error('أدخل مبلغًا أكبر من صفر');
  var ts = Date.now(), id = nid();
  S.ledger.push({ cid: cid, ts: ts, kind: 'payment', amount: -amount, doc: id, note: 'دفعة' });
  S.fund.push({ ts: ts, kind: 'customer_payment', method: method, amount: amount, doc: id, note: cust(cid).name });
  save();
}
function addExpense(cat, amount, note) {
  if (amount <= 0) throw new Error('أدخل مبلغًا أكبر من صفر');
  var ts = Date.now(), id = nid();
  S.expenses.push({ id: id, cat: cat, ts: ts, amount: amount, note: note });
  S.fund.push({ ts: ts, kind: 'expense', method: 'cash', amount: -amount, doc: id, note: cat });
  save();
}
function addFundEntry(dir, amount, note) {
  if (amount <= 0) throw new Error('أدخل مبلغًا أكبر من صفر');
  S.fund.push({ ts: Date.now(), kind: dir === 'in' ? 'manual_in' : 'manual_out', method: 'cash', amount: dir === 'in' ? amount : -amount, note: note });
  save();
}

/* ---------- ui ---------- */
var ui = { tab: 'sale', q: '', pq: '', cart: [], method: 'cash', cust: '', paid: '' };
var ICONS = {
  sale: '<path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  products: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  customers: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18.5 14.2c1.6.8 2.5 2.4 2.5 4.8"/>',
  cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
  reports: '<path d="M5 20V10M12 20V4M19 20v-7"/>'
};
var TABS = [['sale', 'بيع'], ['products', 'المنتجات'], ['customers', 'العملاء'], ['cash', 'الصندوق'], ['reports', 'تقارير']];

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    return '<button type="button" data-act="tab" data-tab="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[t[0]] + '</svg>' + t[1] + '</button>';
  }).join('');
}
function render() {
  renderTabs();
  var main = document.getElementById('main');
  main.innerHTML = { sale: tabSale, products: tabProducts, customers: tabCustomers, cash: tabCash, reports: tabReports }[ui.tab]();
  if (ui.tab === 'sale') { gridInto(); cartInto(); }
  if (ui.tab === 'products') listProducts();
  if (ui.tab === 'customers') listCustomers();
}
function toast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2400);
}
function openSheet(title, html) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetWrap').hidden = false;
  var f = document.querySelector('#sheetBody input:not([type=hidden]), #sheetBody select');
  if (f) f.focus();
}
function closeSheet() { document.getElementById('sheetWrap').hidden = true; }

/* --- sale --- */
function tabSale() {
  return '<label class="f" for="q" style="margin-top:4px">ابحث عن منتج</label>' +
    '<input id="q" type="search" placeholder="حليب، خبز، قهوة..." autocomplete="off" value="' + esc(ui.q) + '">' +
    '<div class="pgrid" id="grid"></div>' +
    '<h2 class="sec">السلة</h2><div id="cart"></div>';
}
function gridInto() {
  var q = norm(ui.q), list = S.products.filter(function (p) { return !q || norm(p.name).indexOf(q) !== -1; });
  document.getElementById('grid').innerHTML = list.length ? list.map(function (p) {
    var st = stockOf(p.id), low = st <= p.min * 1000;
    return '<button type="button" class="pbtn" data-act="add" data-id="' + p.id + '"><span class="pn">' + esc(p.name) + '</span><span class="pp">' + m(p.price) + '</span><span class="ps' + (low ? ' low' : '') + '">المخزون: ' + qtyTxt(st) + (low ? ' · ينقص' : '') + '</span></button>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">لا يوجد منتج بهذا الاسم</div>';
}
function cartInto() {
  var el = document.getElementById('cart');
  if (!ui.cart.length) { el.innerHTML = '<div class="card empty">اضغط على منتج ليدخل السلة</div>'; return; }
  var lines = cartLines(ui.cart), sub = 0, tax = 0;
  lines.forEach(function (l) { sub += l.net; tax += l.tax; });
  var total = sub + tax;
  var html = '<div class="card">' + lines.map(function (l, i) {
    var q = ui.cart[i].qty, over = q * 1000 > stockOf(l.pid);
    return '<div class="row"><div class="grow"><div class="name">' + esc(l.name) + '</div><div class="sub">' + m(l.price) + ' للوحدة' + (over ? ' · <span class="warn">أكثر من المخزون</span>' : '') + '</div></div>' +
      '<div class="stepper"><button type="button" data-act="dec" data-i="' + i + '" aria-label="أنقص">&minus;</button><span class="q num">' + q + '</span><button type="button" data-act="inc" data-i="' + i + '" aria-label="زِد">+</button></div>' +
      '<div class="end" style="min-width:76px"><b>' + m(l.total) + '</b></div></div>';
  }).join('') + '</div>';
  html += '<div class="card" style="margin-top:10px"><div style="padding:12px 14px"><div class="seg" role="group" aria-label="طريقة الدفع">' +
    Object.keys(METHODS).map(function (k) { return '<button type="button" data-act="method" data-m="' + k + '" aria-pressed="' + (ui.method === k) + '">' + METHODS[k] + '</button>'; }).join('') + '</div>';
  if (ui.method === 'credit') {
    html += '<label class="f" for="custSel">العميل</label><select id="custSel"><option value="">اختر العميل</option>' +
      S.customers.map(function (c) { return '<option value="' + c.id + '"' + (String(c.id) === ui.cust ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<label class="f" for="paid">المبلغ المدفوع الآن (د.ج)، اتركه فارغًا إن لم يدفع</label><input id="paid" type="number" inputmode="decimal" min="0" step="0.01" value="' + esc(ui.paid) + '">';
  }
  html += '</div>' + (tax ? '<div class="row"><span class="grow muted">قبل الضريبة</span>' + m(sub) + '</div><div class="row"><span class="grow muted">الضريبة</span>' + m(tax) + '</div>' : '') +
    '<div class="totalbar"><span class="muted">المجموع</span><span class="big">' + m(total) + '</span></div></div>' +
    '<div class="actions" style="margin-top:12px"><button type="button" class="btn" data-act="clear">إفراغ السلة</button><button type="button" class="btn primary" data-act="save" style="flex:2">حفظ البيع</button></div>';
  el.innerHTML = html;
}
function showReceipt(inv) {
  var c = inv.customerId ? cust(inv.customerId) : null;
  var h = '<div class="paper" dir="rtl"><div class="c"><b>' + esc(S.settings.shop) + '</b><br>' + dt(inv.ts) + '<br>فاتورة رقم <span class="num">' + inv.number + '</span>' + (c ? '<br>العميل: ' + esc(c.name) : '') + '</div><hr>' +
    inv.lines.map(function (l) { return '<div class="l"><span>' + esc(l.name) + ' × <span class="num">' + qtyTxt(l.qty) + '</span></span><span>' + m(l.total) + '</span></div>'; }).join('') + '<hr>' +
    (inv.tax ? '<div class="l"><span>قبل الضريبة</span><span>' + m(inv.subtotal) + '</span></div><div class="l"><span>الضريبة</span><span>' + m(inv.tax) + '</span></div>' : '') +
    '<div class="l"><b>المجموع</b><b>' + m(inv.total) + '</b></div><div class="l"><span>الدفع</span><span>' + METHODS[inv.method] + '</span></div>' +
    (inv.method === 'credit' ? '<div class="l"><span>المدفوع</span><span>' + m(inv.paid) + '</span></div><div class="l"><span>المتبقي على العميل</span><span>' + m(inv.total - inv.paid) + '</span></div>' : '') +
    '<hr><div class="c">شكرًا لزيارتكم</div></div>' +
    '<div class="note">هذه معاينة الإيصال. الطباعة على طابعة 58 أو 80 ملم تأتي مع تطبيق أندرويد الحقيقي.</div>' +
    '<div class="actions" style="margin-top:12px"><button type="button" class="btn primary" data-act="closeSheet">بيع جديد</button></div>';
  openSheet('تم حفظ البيع', h);
}

/* --- products --- */
function tabProducts() {
  return '<div style="display:flex;gap:8px;margin-top:4px"><input id="pq" type="search" placeholder="ابحث في المنتجات" aria-label="ابحث في المنتجات" autocomplete="off" value="' + esc(ui.pq) + '"><button type="button" class="btn primary" data-act="newProduct" style="white-space:nowrap">+ منتج</button></div>' +
    '<h2 class="sec">المنتجات والمخزون</h2><div class="card" id="plist"></div>';
}
function listProducts() {
  var q = norm(ui.pq), list = S.products.filter(function (p) { return !q || norm(p.name).indexOf(q) !== -1; });
  document.getElementById('plist').innerHTML = list.length ? list.map(function (p) {
    var st = stockOf(p.id), low = st <= p.min * 1000;
    return '<div class="row"><div class="grow"><div class="name">' + esc(p.name) + '</div><div class="sub">' + m(p.price) + (p.taxBp ? ' · ضريبة <span class="num">' + (p.taxBp / 100) + '%</span>' : '') + '</div></div>' +
      '<div class="end"><span class="chip' + (low ? ' warn' : '') + '">' + qtyTxt(st) + (low ? ' ينقص' : '') + '</span></div>' +
      '<button type="button" class="btn small" data-act="restock" data-id="' + p.id + '">+ مخزون</button></div>';
  }).join('') : '<div class="empty">لا توجد منتجات</div>';
}

/* --- customers --- */
function tabCustomers() {
  var owed = 0; S.customers.forEach(function (c) { var b = balanceOf(c.id); if (b > 0) owed += b; });
  return '<div class="card stat" style="margin-top:4px"><div class="k">مجموع ديون العملاء</div><div class="v ' + (owed ? 'bad' : '') + '">' + m(owed) + '</div></div>' +
    '<div style="display:flex;gap:8px;margin-top:10px"><input id="cq" type="search" placeholder="ابحث عن عميل" aria-label="ابحث عن عميل" autocomplete="off" value="' + esc(ui.cq || '') + '"><button type="button" class="btn primary" data-act="newCustomer" style="white-space:nowrap">+ عميل</button></div>' +
    '<h2 class="sec">العملاء</h2><div class="card" id="clist"></div>';
}
function listCustomers() {
  var q = norm(ui.cq || ''), list = S.customers.filter(function (c) { return !q || norm(c.name).indexOf(q) !== -1; });
  document.getElementById('clist').innerHTML = list.length ? list.map(function (c) {
    var b = balanceOf(c.id);
    return '<button type="button" class="row" data-act="customer" data-id="' + c.id + '" style="width:100%;border:0;background:none;text-align:start"><div class="grow"><div class="name">' + esc(c.name) + '</div><div class="sub num" dir="ltr" style="text-align:start">' + esc(c.phone || '') + '</div></div>' +
      '<div class="end">' + (b > 0 ? '<span class="chip bad">عليه ' + m(b) + '</span>' : b < 0 ? '<span class="chip">له ' + m(-b) + '</span>' : '<span class="muted">لا دين</span>') + '</div></button>';
  }).join('') : '<div class="empty">لا يوجد عملاء</div>';
}
function statementRows(cid) {
  var run = 0;
  return S.ledger.filter(function (x) { return x.cid === cid; }).sort(function (a, b) { return a.ts - b.ts; })
    .map(function (x) { run += x.amount; return { ts: x.ts, note: x.note, amount: x.amount, run: run }; });
}
function showCustomer(cid) {
  var c = cust(cid), b = balanceOf(cid), rows = statementRows(cid).reverse();
  var h = '<div class="card stat"><div class="k">' + (b > 0 ? 'عليه' : b < 0 ? 'له (دفعة مقدّمة)' : 'الرصيد') + '</div><div class="v ' + (b > 0 ? 'bad' : '') + '">' + m(Math.abs(b)) + '</div></div>' +
    '<div class="actions" style="margin-top:10px"><button type="button" class="btn primary" data-act="payment" data-id="' + cid + '">تسجيل دفعة</button><button type="button" class="btn" data-act="copyStatement" data-id="' + cid + '">نسخ كشف الحساب</button></div>' +
    '<h2 class="sec">كشف الحساب</h2><div class="card">' + (rows.length ? rows.map(function (r) {
      return '<div class="row"><div class="grow"><div class="name">' + esc(r.note) + '</div><div class="sub num">' + dt(r.ts) + '</div></div><div class="end"><div class="' + (r.amount > 0 ? 'bad' : 'good') + '">' + (r.amount > 0 ? '+' : '') + m(r.amount) + '</div><div class="sub">الرصيد ' + m(r.run) + '</div></div></div>';
    }).join('') : '<div class="empty">لا توجد حركات بعد</div>') + '</div>';
  openSheet(c.name, h);
}
function statementText(cid) {
  var c = cust(cid), rows = statementRows(cid);
  return 'كشف حساب: ' + c.name + '\n' + S.settings.shop + '\n\n' + rows.map(function (r) { return dt(r.ts) + ' | ' + r.note + ' | ' + fmt(r.amount) + ' | الرصيد ' + fmt(r.run); }).join('\n') + '\n\nالمجموع المستحق: ' + fmt(balanceOf(cid));
}

/* --- cash box --- */
var FUND_LABEL = { sale: 'بيع', customer_payment: 'دفعة عميل', expense: 'مصروف', manual_in: 'إيداع', manual_out: 'سحب', purchase: 'شراء', supplier_payment: 'دفعة مورد' };
function tabCash() {
  var rows = S.fund.slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 40);
  return '<div class="card stat" style="margin-top:4px"><div class="k">الصندوق (النقد فقط)</div><div class="big">' + m(fundBalance()) + '</div></div>' +
    '<div class="actions" style="margin-top:10px"><button type="button" class="btn" data-act="fundIn">إيداع</button><button type="button" class="btn" data-act="fundOut">سحب</button><button type="button" class="btn primary" data-act="expense">مصروف</button></div>' +
    '<h2 class="sec">آخر الحركات</h2><div class="card">' + rows.map(function (r) {
      return '<div class="row"><div class="grow"><div class="name">' + (FUND_LABEL[r.kind] || r.kind) + (r.method !== 'cash' ? ' <span class="chip warn">' + METHODS[r.method] + '</span>' : '') + '</div><div class="sub">' + esc(r.note || '') + ' <span class="num">' + dt(r.ts) + '</span></div></div><div class="end ' + (r.amount > 0 ? 'good' : 'bad') + '"><b>' + (r.amount > 0 ? '+' : '') + m(r.amount) + '</b></div></div>';
    }).join('') + '</div>' +
    '<div class="note">الحركات بالبطاقة أو الشيك أو المحفظة تظهر هنا بوسم، ولا تدخل في رصيد الصندوق النقدي.</div>';
}

/* --- reports --- */
function tabReports() {
  var t0 = startOfToday(), sales = 0, profit = 0, n = 0, exp = 0;
  S.invoices.forEach(function (i) {
    if (i.ts < t0) return; n++; sales += i.total;
    i.lines.forEach(function (l) { profit += l.net - divRound(l.cost * l.qty, 1000); });
  });
  S.expenses.forEach(function (e) { if (e.ts >= t0) exp += e.amount; });
  var low = S.products.filter(function (p) { return stockOf(p.id) <= p.min * 1000; });
  var owed = 0; S.customers.forEach(function (c) { var b = balanceOf(c.id); if (b > 0) owed += b; });
  var card = function (k, v) { return '<div class="card stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; };
  return '<h2 class="sec" style="margin-top:4px">اليوم</h2><div class="grid2">' + card('المبيعات (' + n + ' فاتورة)', m(sales)) + card('الربح التقديري', m(profit)) + card('المصاريف', m(exp)) + card('ديون العملاء', m(owed)) + '</div>' +
    '<h2 class="sec">منتجات تنقص</h2><div class="card">' + (low.length ? low.map(function (p) {
      return '<div class="row"><div class="grow name">' + esc(p.name) + '</div><span class="chip warn">' + qtyTxt(stockOf(p.id)) + ' من ' + p.min + '</span></div>';
    }).join('') : '<div class="empty">كل المنتجات فوق الحد الأدنى</div>') + '</div>' +
    '<div class="note">الربح يحسب من سعر الشراء المسجّل في المنتج. في التطبيق الحقيقي يوجد 19 تقريرًا بنطاق تاريخ قابل للاختيار.</div>' +
    '<div class="actions" style="margin-top:16px"><button type="button" class="btn danger" data-act="reset">إعادة ضبط البيانات التجريبية</button></div>';
}

/* ---------- forms in sheets ---------- */
function field(id, label, attrs) { return '<label class="f" for="' + id + '">' + label + '</label><input id="' + id + '" name="' + id + '" ' + (attrs || '') + '>'; }
function formProduct() {
  openSheet('منتج جديد', '<form data-form="product">' + field('name', 'الاسم', 'type="text" required autocomplete="off"') +
    '<div class="grid2"><div>' + field('price', 'سعر البيع (د.ج)', 'type="number" inputmode="decimal" min="0" step="0.01" required') + '</div><div>' + field('cost', 'سعر الشراء (د.ج)', 'type="number" inputmode="decimal" min="0" step="0.01" value="0"') + '</div>' +
    '<div>' + field('tax', 'الضريبة %', 'type="number" inputmode="decimal" min="0" max="100" step="0.01" value="0"') + '</div><div>' + field('min', 'حد التنبيه', 'type="number" inputmode="numeric" min="0" step="1" value="0"') + '</div></div>' +
    field('open', 'المخزون الحالي', 'type="number" inputmode="numeric" min="0" step="1" value="0"') +
    '<div class="actions" style="margin-top:16px"><button class="btn primary" type="submit">حفظ المنتج</button></div></form>');
}
function formCustomer() {
  openSheet('عميل جديد', '<form data-form="customer">' + field('name', 'الاسم', 'type="text" required autocomplete="off"') + field('phone', 'الهاتف', 'type="tel" inputmode="tel" autocomplete="off"') +
    field('debt', 'دين سابق (د.ج)', 'type="number" inputmode="decimal" min="0" step="0.01" value="0"') +
    '<div class="actions" style="margin-top:16px"><button class="btn primary" type="submit">حفظ العميل</button></div></form>');
}
function formAmount(title, kind, extra, hidden) {
  openSheet(title, '<form data-form="' + kind + '"' + (hidden ? ' data-id="' + hidden + '"' : '') + '>' + extra + field('amount', 'المبلغ (د.ج)', 'type="number" inputmode="decimal" min="0" step="0.01" required') +
    '<div class="actions" style="margin-top:16px"><button class="btn primary" type="submit">حفظ</button></div></form>');
}
var HANDLERS = {
  product: function (f, fd) {
    var name = fd.get('name').trim(); if (!name) throw new Error('اكتب اسم المنتج');
    var p = { id: nid(), name: name, price: toCents(fd.get('price')), taxBp: Math.round(parseFloat(fd.get('tax') || 0) * 100), cost: toCents(fd.get('cost')), min: parseInt(fd.get('min') || 0, 10) || 0 };
    S.products.push(p);
    var o = parseInt(fd.get('open') || 0, 10) || 0;
    if (o > 0) S.stock.push({ pid: p.id, qty: o * 1000, kind: 'opening', ts: Date.now() });
    save(); closeSheet(); render(); toast('تمت إضافة المنتج');
  },
  customer: function (f, fd) {
    var name = fd.get('name').trim(); if (!name) throw new Error('اكتب اسم العميل');
    var c = { id: nid(), name: name, phone: fd.get('phone').trim() };
    S.customers.push(c);
    var d = toCents(fd.get('debt')); if (d > 0) S.ledger.push({ cid: c.id, ts: Date.now(), kind: 'opening', amount: d, note: 'دين سابق' });
    save(); closeSheet(); render(); toast('تمت إضافة العميل');
  },
  restock: function (f, fd) {
    var q = parseInt(fd.get('amount'), 10); if (!(q > 0)) throw new Error('أدخل كمية صحيحة');
    S.stock.push({ pid: +f.dataset.id, qty: q * 1000, kind: 'receipt', ts: Date.now() });
    save(); closeSheet(); render(); toast('تمت زيادة المخزون');
  },
  payment: function (f, fd) {
    recordCustomerPayment(+f.dataset.id, toCents(fd.get('amount')), fd.get('method') || 'cash');
    closeSheet(); render(); toast('تم تسجيل الدفعة');
  },
  expense: function (f, fd) { addExpense(fd.get('cat'), toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast('تم تسجيل المصروف'); },
  fundin: function (f, fd) { addFundEntry('in', toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast('تم الإيداع'); },
  fundout: function (f, fd) { addFundEntry('out', toCents(fd.get('amount')), (fd.get('note') || '').trim()); closeSheet(); render(); toast('تم السحب'); }
};

/* ---------- events ---------- */
var ACTS = {
  tab: function (b) { ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); },
  closeSheet: function () { closeSheet(); render(); },
  add: function (b) {
    var id = +b.dataset.id, l = ui.cart.find(function (c) { return c.pid === id; });
    if (l) l.qty++; else ui.cart.push({ pid: id, qty: 1 });
    cartInto();
  },
  inc: function (b) { ui.cart[+b.dataset.i].qty++; cartInto(); },
  dec: function (b) { var l = ui.cart[+b.dataset.i]; l.qty--; if (l.qty <= 0) ui.cart.splice(+b.dataset.i, 1); cartInto(); },
  clear: function () { ui.cart = []; ui.paid = ''; cartInto(); },
  method: function (b) { ui.method = b.dataset.m; cartInto(); },
  save: function () {
    var paidEl = document.getElementById('paid'); if (paidEl) ui.paid = paidEl.value;
    try {
      var inv = createSale({ cart: ui.cart, method: ui.method, customerId: ui.cust ? +ui.cust : null, paid: ui.method === 'credit' ? toCents(ui.paid) : 0 });
      ui.cart = []; ui.paid = ''; ui.cust = ''; ui.method = 'cash';
      cartInto(); gridInto(); showReceipt(inv);
    } catch (e) { toast(e.message); }
  },
  newProduct: formProduct,
  newCustomer: formCustomer,
  restock: function (b) { var p = prod(+b.dataset.id); formAmount('زيادة مخزون: ' + p.name, 'restock', '', b.dataset.id); document.querySelector('label[for=amount]').textContent = 'الكمية المستلمة'; },
  customer: function (b) { showCustomer(+b.dataset.id); },
  payment: function (b) {
    formAmount('تسجيل دفعة', 'payment', '<label class="f" for="method">طريقة الدفع</label><select id="method" name="method"><option value="cash">نقدًا</option><option value="card">بطاقة</option><option value="cheque">شيك</option><option value="wallet">محفظة</option></select>', b.dataset.id);
  },
  copyStatement: function (b) {
    var text = statementText(+b.dataset.id);
    var show = function () { openSheet('كشف الحساب', '<textarea id="st" rows="10" readonly>' + esc(text) + '</textarea><div class="note">انسخ النص وأرسله عبر واتساب.</div>'); document.getElementById('st').select(); };
    try { navigator.clipboard.writeText(text).then(function () { toast('تم نسخ كشف الحساب'); }, show); } catch (e) { show(); }
  },
  fundIn: function () { formAmount('إيداع في الصندوق', 'fundin', field('note', 'ملاحظة', 'type="text" autocomplete="off"')); },
  fundOut: function () { formAmount('سحب من الصندوق', 'fundout', field('note', 'ملاحظة', 'type="text" autocomplete="off"')); },
  expense: function () {
    formAmount('مصروف جديد', 'expense', '<label class="f" for="cat">النوع</label><select id="cat" name="cat"><option>كراء</option><option>كهرباء وماء</option><option>أجور</option><option>نقل</option><option>أخرى</option></select>' + field('note', 'ملاحظة', 'type="text" autocomplete="off"'));
  },
  reset: function () { S = seed(); ui.cart = []; ui.cust = ''; ui.paid = ''; ui.method = 'cash'; save(); render(); toast('عادت البيانات التجريبية'); }
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || !ACTS[b.dataset.act]) return;
  ACTS[b.dataset.act](b);
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'q') { ui.q = e.target.value; gridInto(); }
  else if (id === 'pq') { ui.pq = e.target.value; listProducts(); }
  else if (id === 'cq') { ui.cq = e.target.value; listCustomers(); }
  else if (id === 'paid') { ui.paid = e.target.value; }
});
document.addEventListener('change', function (e) { if (e.target.id === 'custSel') ui.cust = e.target.value; });
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, h = HANDLERS[f.dataset.form]; if (!h) return;
  try { h(f, new FormData(f)); } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('sheetWrap').hidden) ACTS.closeSheet(); });
render();
</script>

</body>
</html>
